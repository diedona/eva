services:

  rabbitmq:
    image: "rabbitmq:4-management"
    container_name: rabbitmq_ctn
    ports:
      - 5672:5672 # standard port
      - 7005:15672 # web ui (customized)
    networks:
      - backend_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=eva
      - RABBITMQ_DEFAULT_PASS=eva123

networks:
  backend_network:

volumes:
  rabbitmq_data:
  rabbitmq_logs:
  mongodb_data:
  postgres_data: